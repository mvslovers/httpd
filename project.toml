[project]
name = "httpd"
version = "4.0.1"
type = "application"

[toolchain]
# Pins the refs release.yml builds the published artifacts against; build.yml
# deliberately keeps floating on main so a cc370/libc370 regression surfaces
# in a PR build (mbt#68). cc370 is omitted -- it defaults to main and has no
# releases to pin to yet.
#
# Without this the release CI builds against libc370 main, which is how ftpd's
# first 1.0.0 attempt shipped reporting an unreleased runtime nobody could
# reproduce from a tag. HTTPD005I names the runtime it linked against, so an
# unpinned release build makes that line unreproducible in exactly the same way.
libc370 = "1.0.3"

[build]
# The build stamp behind HTTPD000I/001I/006W is not injected here: mbt
# generates .mbt/buildstamp.h and puts it on the include path, so httpd.c gets
# MBT_VERSION / MBT_COMMIT / MBT_COMMIT_DIRTY from `#include <buildstamp.h>`
# (mbt#59). As a header it is a real prerequisite via -MMD, so a new commit
# recompiles the banner TU instead of leaving it stamped with the previous
# hash. The -DVERSION that used to be here fed a `#ifndef VERSION` block in
# httpd.c that no longer exists.
#
# -Wall -Werror: the root CLAUDE.md has always documented these as enforced,
# but nothing passed them, so 598 warnings accumulated unseen -- among them a
# printf with two %s and one argument. Issue #138 cleared the tree; this line
# is what keeps it clear. Adding a warning now fails the build, which is the
# point. Do not add -Wno-* here: the trigraph warnings that would have needed
# one were removed at the source instead (#139).
cflags = [
	"-I",
	"include",
	"-I",
	"credentials/include",
	"-Wall",
	"-Werror",
]

[host]
# `make test-host` reuses build.cflags (mbt/scripts/mbttesthost.py) but compiles
# with the developer machine's cc, whose -Wall is a different and far larger set
# than cc370's -- the pointer-sign warnings alone run into the hundreds, and
# none of them say anything about the MVS build. -Werror exists here to keep the
# shipped target build clean; gating the fast host loop on another compiler's
# opinions would only make that loop unusable. Warnings still print.
cflags = ["-Wno-error"]

[dependencies]
"mvslovers/ufsd" = ">=1.2.1"

# -- Internal autocall archive ------------------------------------
# All of httpd's objects, archived into build/httpdint.a.  Every module
# autocalls it: each [[module]] below lists only its own root source(s)
# (each root defines its own main(), so they cannot be globbed into one
# module), and the linker pulls the shared rest from this archive by
# autocall (referenced members only -> minimal load modules).  Mirrors the
# v1 NCALIB-autocall model; never shipped (the public client lib is [lib]).
[internal]
sources = ["src/*.c", "credentials/src/*.c"]
# Module entry points are kept OUT of the autocall pool so their custom __start
# can never shadow another module's (or a test's) entry by autocall:
#   - cgistart: the CGI launcher (a per-module root, also shipped in [lib]).
#   - httpstrt: HTTPD's own __start (rejects SYSPRINT, opens HTTPDOUT/ERR/IN).
# The HTTPD module lists httpstrt.c in its own [[module]] sources, so it still
# gets it; everything else (CGI modules, [[test]] modules) resolves the default
# libc __start instead.
exclude = ["src/cgistart.c", "src/httpstrt.c"]

# -- Load Modules -------------------------------------------------
# v1 'include = ["@@CRT1", <members>]' -> startup = "crt1" + the member
# roots as 'sources'; the shared body resolves from [internal] by autocall.

# Main HTTPD server (APF-authorized)
[[module]]
name = "HTTPD"
startup = "crt1"
sources = ["src/httpstrt.c", "src/httpd.c", "src/httpprm.c"]
ac = 1

# SSI handler modules (CGI programs sharing the cgistart launcher)
[[module]]
name = "HTTPDM"
startup = "crt1"
sources = ["src/cgistart.c", "src/httpdm.c"]

[[module]]
name = "HTTPDMTT"
startup = "crt1"
sources = ["src/cgistart.c", "src/httpdmtt.c"]

[[module]]
name = "HTTPDSRV"
startup = "crt1"
sources = ["src/cgistart.c", "src/httpdsrv.c"]

# Acceptance vehicle for issues #154/#174: allocates, then abends S0C1
# without freeing.  Drive it a few hundred times and every other CGI must
# still load at its original speed -- measurable with httpd's own code.
# Like every module since 4.0.0 it is inert unless a Parmlib route names it.
[[module]]
name = "ABEND0C1"
startup = "crt1"
sources = ["src/cgistart.c", "src/abend0c1.c"]

# HTTPDSL (/dsl/*) and HTTPJES2 (/jes/*) are no longer built.  Both were
# superseded by mvsMF's dataset and jobs APIs, and the sample Parmlib no longer
# offers them.  Their sources moved to tbd/ (with stck2tv.c, which nothing ever
# called) -- outside the src/*.c glob above, so they are not compiled at all
# rather than merely un-autocalled.  See tbd/README.md; deleting them is a
# separate step.

# -- Tests --------------------------------------------------------
# http_cgictx_get() registrar.  Uses lock()/__getm() (MVS SVCs), so it is
# MVS-only (make test-mvs); the host build is skipped (it pulls httpd.h's
# crent370 internals).  http_cgictx_get resolves from the [internal] autocall
# archive, so only the test root is listed here.
[[test]]
name = "TSTGCTX"
sources = ["test/mvs/tstgctx.c"]
host = false                     # uses lock()/__getm() SVCs -> MVS-only (test-mvs)

# http_decode() / httpdeco() URI percent+plus decoder.  MVS-target like
# TSTGCTX: httpdeco pulls no SVCs, but it is reached through httpd.h (crent370
# runtime headers, not host-portable), so the host build cannot compile it.
# httpdeco (HTTPDECO) and asc2ebc resolve from the [internal] autocall archive,
# so only the test root is listed here.
[[test]]
name = "TSTDECO"
sources = ["test/tstdeco.c"]
host = false                 # httpd.h -> crent370 internals -> MVS-only (test-mvs)

# String-safety helpers httpesc() (HTML escape) + httpsrdr() (safe redirect).
# Both are free of httpd.h, so this test is DUAL: it runs natively via
# test-host AND on MVS via test-mvs.  The helper sources are listed explicitly
# so the host build (no autocall) can link them.
[[test]]
name = "TSTSAFE"
sources = ["test/tstsafe.c", "src/httpesc.c", "src/httpsrdr.c"]

# httpbody() request-body length classifier (S7 Content-Length enforcement).
# Free of httpd.h -> DUAL (host + MVS); helper source listed for the host link.
[[test]]
name = "TSTBODY"
sources = ["test/tstbody.c", "src/httpbody.c"]

# credexp() credential-reaper expiry decision (M2 session timeout).  Free of
# project headers -> DUAL (host + MVS); helper source listed for the host link.
[[test]]
name = "TSTEXPIR"
sources = ["test/tstexpir.c", "credentials/src/credexp.c"]

# httpracf() SAF authorization decision table (issue #135): rc 0 and 4 both
# allow, -1 must not.  Free of httpd.h -> DUAL (host + MVS); helper source
# listed for the host link.
[[test]]
name = "TSTRACF"
sources = ["test/tstracf.c", "src/httpracf.c"]

# httpstat() status code -> status line table (issue #181).  A code the table
# does not know is answered with 500, so a gap is silent on the wire -- the
# test pins every code httpd itself emits.  Free of httpd.h -> DUAL (host +
# MVS); helper source listed for the host link.
[[test]]
name = "TSTSTAT"
sources = ["test/tststat.c", "src/httpstat.c"]

# httprlm() Basic realm from the SMF ID (issue #191).  __smfid() hands over a
# 4-byte, blank-padded, unterminated field, and an empty realm would collapse
# every protection space on the origin (RFC 7617 makes it required) -- so the
# degenerate inputs are what this pins.  Free of httpd.h -> DUAL (host + MVS).
[[test]]
name = "TSTREALM"
sources = ["test/tstrealm.c", "src/httprlm.c"]

# credid_enc()/credid_dec() round-trip + flag survival across a repeat read of a
# stored CRED (issue #109: http_get_userid() garbage on a cache-hit read).
# blowfish_encrypt/decrypt are crent370 (MVS) -> MVS-only test (test-mvs); the
# credid_*/cred_* bodies resolve from the [internal] autocall archive.
[[test]]
name = "TSTCRED"
sources = ["test/mvs/tstcred.c"]
host = false                     # blowfish_* are MVS-only (crent370) -> test-mvs

# http_get_userid() end-to-end on a live HTTPC (issue #109): real cred_login()
# + cache hit + the real HTTPGUID export.  MVS-only (blowfish + RACF SVCs);
# http_get_userid/credid_/cred_ resolve from the [internal] autocall archive.
[[test]]
name = "TSTGUID"
sources = ["test/mvs/tstguid.c"]
host = false                     # blowfish_* + RACF SVCs are MVS-only -> test-mvs

# http_get_password() end-to-end on a live HTTPC (issue #111): decrypts the
# caller's password from httpc->cred->id via the key pointer cached in the HTTPD
# block, for the JES2 INTRDR job-card use case.  MVS-only (blowfish + RACF SVCs);
# http_get_password/credid_/cred_ resolve from the [internal] autocall archive.
[[test]]
name = "TSTGPWD"
sources = ["test/mvs/tstgpwd.c"]
host = false                     # blowfish_* + RACF SVCs are MVS-only -> test-mvs

# credtok_logout_arr() + wrapper (issue #113): logout must find, unlink and free
# the CRED in the supplied array so the token stops resolving.  Guards the split
# that lets http_logout() reach httpd's store from a CGI's GRT.  MVS-only (SHA256
# token + array/lock SVCs); cred_/credtok_ resolve from the [internal] archive.
[[test]]
name = "TSTLOUT"
sources = ["test/mvs/tstlout.c"]
host = false                     # crent370 SVCs are MVS-only -> test-mvs

# http_new_env() / httpnenv() env-block allocation + layout (guards the M9
# offsetof sizing).  Needs the HTTPV struct via httpd.h, so MVS-only; httpnenv
# (HTTPNENV) resolves from the [internal] autocall archive.
[[test]]
name = "TSTNENV"
sources = ["test/tstnenv.c"]
host = false                 # httpd.h -> crent370 internals -> MVS-only (test-mvs)

# Where the CGI heap subpool (libc370#89) can be set at all -- the measurement
# issue #154's stage 2 is built on.  TSTSP is the driver: it runs the probe on
# the main task, on a cthread (the shape of an httpd worker) and inside a
# module reached by LINK.  TSTSPM is the LINKed target, not a test of its own:
# run standalone it returns 0, and it reports its measurement through the
# return code __linkds() hands back.  The runner's STEPLIB is TESTLIB+LINKLIB,
# so TSTSP finds TSTSPM in the TESTLIB it was just deployed to.
[[test]]
name = "TSTSP"
sources = ["test/mvs/tstsp.c"]
host = false                   # cthreads + LINK + GETMAIN are SVCs -> test-mvs

[[test]]
name = "TSTSPM"
startup = "crt1"                # like a CGI module: @@CRT0 without the CTHREAD IDENTIFY
sources = ["test/mvs/tstspm.c"]
host = false                    # LINK target for TSTSP -> test-mvs

# http_link() failure reporting (issue #131): a module that cannot be loaded
# must not come out as an abend code.  Rests on a libc370 contract -- __linkds()
# on a missing module returns 0 with prc == -1 -- which the test pins first, so
# a change there fails here instead of resurfacing as "U0001 ABEND" in a 503.
# MVS-only (LINK SVC); httplink resolves from the [internal] autocall archive.
[[test]]
name = "TSTLINK"
sources = ["test/mvs/tstlink.c"]
host = false                    # LINK SVC + httpd.h internals -> test-mvs

# TSTLNKM is the LINK target for TSTLINK's T5, not a test of its own: it runs
# to completion and returns a negative rc, the case httppcgi() used to report
# as an abend.  crt1 on purpose -- cgistart clamps a negative main() rc to 0,
# so a module with its own __start is the only thing that can still produce
# one.  Run standalone by the runner (no parm) it returns 0.
[[test]]
name = "TSTLNKM"
startup = "crt1"                # own __start, i.e. no cgistart clamp
sources = ["test/mvs/tstlnkm.c"]
host = false                    # LINK target for TSTLINK -> test-mvs

# There is deliberately no counterpart built with cgistart.  A cgistart module
# refuses to run without a server context (#141: RC 12 from
# not_a_server_module before main() is ever called), so the clamp it applies to
# a negative main() rc is unreachable from a bare test module -- both as a
# standalone step and as a LINK target driven from a fabricated HTTPC.

# -- Public CGI SDK export ----------------------------------------
# What httpd ships for consumers (e.g. mvsmf, which declares
# "mvslovers/httpd" in its [dependencies]).  The client library is the
# CGI launcher cgistart.o plus the public headers: a CGI program links
# cgistart (which provides __start, builds argv, and calls the program's
# main()) and reaches the http_* API at runtime through the httpx
# callback table (http_get_httpx()).  cgistart uses only the public API
# (httpcgi.h), so external CGIs need not copy it -- they link this object.
[lib]
name = "httpd"
sources = ["src/cgistart.c"]
headers = [
	"include/httpcgi.h",
	"include/httpxlat.h",
	"include/dbg.h",
	"include/errors.h",
	"include/types.h",
]

# -- Distribution (SMP4 install package) --------------------------
# Turns `make package` into an installable product, on the two transports ufsd
# and ftpd ship with, plus a third one they have no need for:
#
#   load modules -> XMIT -> staging HTTPLOAD -> SMP ++MOD -> HTTPD.<vrm>.LINKLIB
#   samplib/     -> XMIT -> TSO RECEIVE                   -> HTTPD.<vrm>.SAMPLIB
#   static/      -> UFS370 image -> IND$FILE              -> HTTPD.<vrm>.WEBROOT.UFS
#
# The webroot disk (issue #252) rides neither of the first two, and not because
# of a gap in the tooling: SMP has no element type for a DSORG=PS/RECFM=U image
# and must never touch site content, and TSO RECEIVE allocates its own target
# and refuses to merge into an existing one -- a first-install-only transport
# for something an operator updates.  So it travels as a plain file in the
# archive (`extra` below) and goes up over IND$FILE, which needs nothing on the
# target beyond a 3270 session.  `make webroot` builds it; the Makefile carries
# the why, docs/installation.md the operator's side.
#
# SMP *copies* the host-bound modules rather than re-binding them (a COPY-style
# ++JCLIN is what says so), which is what keeps HTTPD's ac = 1 and every custom
# entry point exactly as ld370 set them.  The sample library stays outside SMP:
# an MCS card ends at column 72 and HTTPPRM0 has comment lines reaching column
# 80, so routing the configuration pattern through the SYSMOD would make it
# answer to a delivery mechanism.  The datasets are versioned, so every release
# brings a fresh SAMPLIB anyway -- there is no in-place update for SMP to
# manage.
#
# samplib/httpd carries @LINKLIB@ in its STEPLIB, which mbtdist replaces with
# the versioned target while staging -- the same placeholder ufsd's and ftpd's
# procs use, and the reason the shipped proc points at the library SMP actually
# installed into rather than at a name fixed when the file was written.  Do not
# mention a placeholder in a nearby comment: the substitution runs over the
# whole member, and a 21-character dataset name landing in a comment line is how
# a proc that fit an FB-80 card stops fitting one.
#
# Every value is a dataset name; the ddname SMP addresses it by is always the
# last qualifier, so LINKLIB, SAMPLIB, HTTPLOAD and AHTTPLOD fall out of the
# names.  The webroot is the one name with a fourth qualifier
# (HTTPD.@VRM@.WEBROOT.UFS) and it is deliberate: no ddname is derived from it
# because nothing here allocates or receives it, and .UFS says at a glance that
# the dataset is a filesystem image rather than a library.  Do not normalise it
# into the three-qualifier pattern -- it is not part of that scheme.  @VRM@ becomes V4R0M0 at package time (V4R0M0D while the version still
# carries -dev).  ufsd/ftpd spell these <product>LOAD / A<product>LOD, which for
# a five-letter product would be nine characters; HTTPLOAD/AHTTPLOD keeps the
# suffix and drops the letter, rather than keeping HTTPD and truncating the
# suffix (HTTPDLOD/AHTTPDLD).  Both names go into the FMID's JCLIN, so this is a
# one-shot choice -- changing it later is a new functional level.
#
# All five [[module]] entries ship, ABEND0C1 included: mbtdist packages every
# module and offers no exclude.  Deliberate rather than overlooked -- since
# 4.0.0 a module is inert unless a Parmlib route names it, and the shipped
# HTTPPRM0 leaves its /.abend line commented out.  It is the acceptance vehicle
# for the storage reclaim (#154/#174), and a diagnostic that is present but
# unreachable is worth more than one an operator would have to rebuild to use.
[distribution]
# Shipped into the archive as README.md, which is the name the generated install
# job points at ("See the README for which member goes where").  Without it the
# package tells the operator to read a file it does not contain.
readme = "docs/installation.md"

# The webroot disk, put in the archive as `httpd-webroot.img` -- `extra` takes
# the basename, so the path here is only where `make webroot` writes it and the
# name an operator sees is the file's own.  Listed rather than generated by
# mbtdist: the image is not a dataset the install job creates, and nothing in
# the SYSMOD or the RECEIVE plan knows about it.  `make package` and `make dist`
# both depend on the target that builds it, because a missing `extra` file is a
# hard error here -- deliberately: an archive quietly missing the webroot would
# look complete and serve nothing on /.
#
# Under build/ rather than dist/ on purpose.  The release workflow publishes
# `dist/*` as Release assets, so an image there would show up beside the
# versioned artifacts under a version-less name, duplicating what the archive
# already carries.
extra = ["build/webroot/httpd-webroot.img"]

[distribution.smp]
# One FMID per minor release, spent exactly once: it names a functional level,
# and a changed one is a new level.  Patches on top of it ship as PTFs.  4.0.x
# is THTP400; a later 4.1.0 becomes THTP410 and is installed as a clean cut
# (RESTORE + REJECT the old, then receive the new).  The T stays clear of the
# E??nnnn namespace MVS 3.8j's own function SYSMODs occupy (EBB1102 is 3.8j
# itself, alongside EAS1102, EBT1102, EDE1102, ...).
#
# Verified free the way TFTP100 and TUFS120 were, on both stands, 2026-08-24:
# LIST CDS SYSMOD(THTP400) and LIST ACDS SYSMOD(THTP400) each answered RC 04
# with "THE FOLLOWING SELECTED ENTRIES WERE NOT FOUND" -- mvsdev (MVS/CE,
# JOB01948) and drnmig3a (TK5, JOB00028), both HMASMP LVL 04.48.  That is the
# check that counts: the SMPPTS scan done earlier shows only what was
# *received*, while the CDS and ACDS store hashed member names, so a LIST
# against both zones is the only way to see what is applied or accepted.
# A test install must still use a throwaway id -- a half-applied FMID would
# occupy this one, and smp-todo.md reserves TTST400 for exactly that.
fmid = "THTP400"
system = "Z038"

# Empty despite the [dependencies] entry on ufsd, which is a *build* time one:
# libufs is linked statically, so nothing of ufsd has to be installed for the
# load modules to run.  At run time it is soft even though 4.0.0 serves static
# files from UFS and nowhere else: ufs_sys_init() failing is HTTPD044W and the
# server keeps running, so every MOD= route -- mvsMF, the display modules --
# works on a system with no UFSD at all.  REQ(TUFS120) would therefore refuse
# the install wherever UFSD is absent, for a facility that already degrades on
# its own.  The installation guide documents UFSD as an optional runtime
# prerequisite instead, which is also how ufsd itself treats RAKF.
prereq = []

accept_fmid = true              # accept the FMID once so a PTF can be RESTOREd
lklib = "HTTPD.@VRM@.HTTPLOAD"  # staging: what the load XMIT is received into
target = "HTTPD.@VRM@.LINKLIB"  # where the load modules end up
distlib = "HTTPD.@VRM@.AHTTPLOD"

[[distribution.library]]
dir = "samplib"
target = "HTTPD.@VRM@.SAMPLIB"

# -- Release ------------------------------------------------------
[release]
version_files = ["VERSION"]
